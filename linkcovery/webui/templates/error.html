<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkCovery Error</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7f7f4; --panel: #ffffff; --ink: #1d1f1f; --ink-secondary: #5b5f63;
        --muted: #808588; --border: #e3e6e8; --accent: #1f7a5a; --accent-ink: #ffffff;
        --shadow: 0 6px 20px rgba(24,26,28,0.08); --radius-lg: 16px; --radius: 12px;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: var(--ink); background: radial-gradient(1200px 700px at 10% -10%, #e7efe8, transparent), var(--bg);
        -webkit-font-smoothing: antialiased; }
      a { color: inherit; text-decoration: none; }
      .container { max-width: 640px; margin: 0 auto; padding: 60px 20px; }
      .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg);
        padding: 32px; box-shadow: var(--shadow); text-align: center; }
      .icon { font-size: 48px; margin-bottom: 16px; }
      .title { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
      .text { font-size: 14px; color: var(--ink-secondary); margin-bottom: 8px; line-height: 1.5; }
      .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border: none;
        border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer;
        background: var(--accent); color: var(--accent-ink); text-decoration: none; margin-top: 18px; }
      .btn:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <div class="icon">&#9888;</div>
        <div class="title">Something went wrong</div>
        <div class="text">{{ message }}</div>
        {% if details %}
          <div class="text">{{ details }}</div>
        {% endif %}
        {% if hint %}
          <div class="text" style="color:var(--muted)">Hint: {{ hint }}</div>
        {% endif %}
        <a class="btn" href="/">Back to list</a>
      </div>
    </div>
  </body>
</html>
